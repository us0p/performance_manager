{{define "body"}}
<div class="full-screen grid-container grid-container--centralized">
	<h1 class="title">Update your password</h1>
	<form method="post" action="/reset-password" class="form-account-activation">
		<div class="form-field">
			<label for="new-pass" class="form-field__label">New Password</label>
			<input id="new-pass" type="password" autocomplete="new-password" />
		</div>
		<div class="form-field">
			<label for="conf-pass" class="form-field__label">Confirm Password</label>
			<input id="conf-pass" type="password" />
		</div>
		<button type="submit">Update password</button>
	</form>
</div>
{{end}}
