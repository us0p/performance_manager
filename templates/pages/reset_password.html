{{define "body"}}
<div class="full-screen grid-container grid-container--centralized">
	<h1 class="title">Request password update</h1>
	<form method="post" action="/reset-password" class="form-account-activation">
		<div class="form-field">
			<label for="email" class="form-field__label">E-mail</label>
			<input id="email" type="email" />
		</div>
		<button type="submit">Send update request</button>
	</form>
</div>
{{end}}
